<rect width="400" height="442" rx="16" fill="#0D1117" stroke="#30363D"/>
<text x="20" y="32" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#3FB6E0">1.6M+ metered customers</text><rect x="70.0" y="50" width="260" height="58" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/><text x="200.0" y="71.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#F0F6FC">Utility subsidiaries</text><text x="200.0" y="95.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#9198A1">multiple tenants</text><line x1="200.0" y1="108" x2="200.0" y2="144" stroke="#6E7681" stroke-width="2" marker-end="url(#a)"/><rect x="70.0" y="144" width="260" height="66" rx="10" fill="#161B22" stroke="#3FB6E0" stroke-width="2"/><text x="200.0" y="169.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#F0F6FC">Billing core</text><text x="200.0" y="193.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#9198A1">multi-tenant · Java</text><line x1="200.0" y1="210" x2="200.0" y2="246" stroke="#6E7681" stroke-width="2" marker-end="url(#a)"/><text x="210.0" y="233.0" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#9198A1">events</text><rect x="70.0" y="246" width="260" height="58" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/><text x="200.0" y="267.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#F0F6FC">Kafka</text><text x="200.0" y="291.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#9198A1">event pipelines</text><line x1="200.0" y1="304" x2="106.0" y2="360" stroke="#6E7681" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="360" width="172" height="62" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/><text x="106.0" y="383.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#F0F6FC">Elasticsearch</text><text x="106.0" y="407.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#9198A1">search: s → ms</text><line x1="200.0" y1="304" x2="294.0" y2="360" stroke="#6E7681" stroke-width="2" marker-end="url(#a)"/><rect x="208" y="360" width="172" height="62" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/><text x="294.0" y="383.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#F0F6FC">Fintech gateway</text><text x="294.0" y="407.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#9198A1">VietQR · JWE/JWS</text>
