<svg xmlns="http://www.w3.org/2000/svg" width="400" height="442" viewBox="0 0 400 442" role="img" aria-labelledby="t d">
<title id="t">EV-rental CRM and IoT fleet platform architecture</title>
<desc id="d">EV fleet devices publish over MQTT to an EMQX broker consumed by a Go Gin backend, which streams live vehicle state to React and Vue dashboards over WebSockets and serves a Flutter app.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#818B98"/></marker></defs>
<rect width="400" height="442" rx="16" fill="#FFFFFF" stroke="#D1D9E0"/>
<text x="20" y="32" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#0A6E8F">Real-time tracking · 50-vehicle pilot</text><rect x="70.0" y="50" width="260" height="58" rx="10" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1"/><text x="200.0" y="71.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#1F2328">EV fleet</text><text x="200.0" y="95.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#59636E">IoT devices</text><line x1="200.0" y1="108" x2="200.0" y2="144" stroke="#818B98" stroke-width="2" marker-end="url(#a)"/><text x="210.0" y="131.0" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#59636E">MQTT</text><rect x="70.0" y="144" width="260" height="58" rx="10" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1"/><text x="200.0" y="165.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#1F2328">EMQX</text><text x="200.0" y="189.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#59636E">broker</text><line x1="200.0" y1="202" x2="200.0" y2="238" stroke="#818B98" stroke-width="2" marker-end="url(#a)"/><rect x="70.0" y="238" width="260" height="66" rx="10" fill="#F6F8FA" stroke="#0A6E8F" stroke-width="2"/><text x="200.0" y="263.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#1F2328">Go / Gin backend</text><text x="200.0" y="287.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#59636E">feature-based clean arch</text><line x1="200.0" y1="304" x2="106.0" y2="360" stroke="#818B98" stroke-width="2" marker-end="url(#a)"/><text x="178.0" y="337.0" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#59636E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">WebSocket</text><rect x="20" y="360" width="172" height="62" rx="10" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1"/><text x="106.0" y="383.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#1F2328">Ops dashboards</text><text x="106.0" y="407.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#59636E">React · Vue</text><line x1="200.0" y1="304" x2="294.0" y2="360" stroke="#818B98" stroke-width="2" marker-end="url(#a)"/><text x="222.0" y="337.0" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#59636E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">REST</text><rect x="208" y="360" width="172" height="62" rx="10" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1"/><text x="294.0" y="383.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#1F2328">Rider app</text><text x="294.0" y="407.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#59636E">Flutter</text>
