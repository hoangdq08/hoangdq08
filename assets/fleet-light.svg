'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#59636E">WebSocket</text><rect x="790" y="30" width="180" height="76" rx="10" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1"/><text x="880.0" y="60.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#1F2328">Ops dashboards</text><text x="880.0" y="84.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#59636E">React · Vue</text><line x1="700" y1="130" x2="790" y2="190" stroke="#818B98" stroke-width="2" marker-end="url(#a)"/><text x="752" y="148.0" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#59636E">REST</text><rect x="790" y="154" width="180" height="76" rx="10" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1"/><text x="880.0" y="184.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#1F2328">Rider app</text><text x="880.0" y="208.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#59636E">Flutter</text><text x="30" y="40" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#0A6E8F">Real-time tracking · 50-vehicle pilot</text>
