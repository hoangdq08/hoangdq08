<title id="t">Đỗ Quốc Hoàng, Senior Backend Engineer</title>
<desc id="d">Terminal: Đỗ Quốc Hoàng, Senior Backend Engineer, Java and Go. 1.6M+ metered customers on a multi-tenant billing core. Search latency from seconds to milliseconds with Kafka and Elasticsearch. 50-vehicle EV pilot with real-time IoT tracking in Go. 5+ years shipping to production. Open to remote and freelance backend roles.</desc>
