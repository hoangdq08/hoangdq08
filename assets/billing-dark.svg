<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="t d">
<title id="t">Multi-tenant water-utility billing architecture</title>
<desc id="d">Utility subsidiaries feed a multi-tenant billing core, which publishes events to Kafka pipelines that feed an Elasticsearch search layer and a secure VietQR payment gateway.</desc>
