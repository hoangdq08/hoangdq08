<rect width="1000" height="260" rx="16" fill="#0D1117" stroke="#30363D"/>
<rect x="30" y="95" width="190" height="70" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/><text x="125.0" y="122.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#F0F6FC">Utility subsidiaries</text><text x="125.0" y="146.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#9198A1">multiple tenants</text><line x1="220" y1="130" x2="290" y2="130" stroke="#6E7681" stroke-width="2" marker-end="url(#a)"/><rect x="290" y="85" width="230" height="90" rx="10" fill="#161B22" stroke="#3FB6E0" stroke-width="2"/><text x="405.0" y="122.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#F0F6FC">Billing core</text><text x="405.0" y="146.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#9198A1">multi-tenant · Java</text><line x1="520" y1="130" x2="590" y2="130" stroke="#6E7681" stroke-width="2" marker-end="url(#a)"/><text x="555.0" y="122.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#9198A1">events</text><rect x="590" y="95" width="150" height="70" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/><text x="665.0" y="122.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#F0F6FC">Kafka</text><text x="665.0" y="146.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#9198A1">event pipelines</text><line x1="740" y1="130" x2="800" y2="70" stroke="#6E7681" stroke-width="2" marker-end="url(#a)"/><rect x="800" y="30" width="170" height="76" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/><text x="885.0" y="60.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#F0F6FC">Elasticsearch</text><text x="885.0" y="84.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#9198A1">search: s → ms</text><line x1="740" y1="130" x2="800" y2="190" stroke="#6E7681" stroke-width="2" marker-end="url(#a)"/><rect x="800" y="154" width="170" height="76" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/><text x="885.0" y="184.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#F0F6FC">Fintech gateway</text><text x="885.0" y="208.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#9198A1">VietQR · JWE/JWS</text><text x="30" y="40" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#3FB6E0">1.6M+ metered customers</text>
